name: Repack Repomix

on:
  # Weekly cron — Lunes 03:00 UTC (antes del horario pico de trabajo)
  schedule:
    - cron: "0 3 * * 1"

  # Manual trigger desde la Actions tab
  workflow_dispatch:
    inputs:
      template:
        description: "Repack solo una plantilla (vacío = todas)"
        required: false
        type: string

  # Cuando alguien hace push directo a main que toca INTEGRATION.md
  push:
    branches: [main]
    paths:
      - "templates/**/INTEGRATION.md"
      - "templates/**/SKILL.md"
      - ".gitmodules"

  # Cuando un submodule apunta a un nuevo commit (manual update)
  # Nota: GitHub no dispara workflows por cambios en submodules automáticamente;
  # el operador debe correr el workflow_dispatch después de `git submodule update --remote`.

concurrency:
  group: repack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write   # necesario para crear PRs automáticos
      pull-requests: write  # necesario para crear PRs automáticos

    steps:
      - name: Checkout repo (con submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect templates con source/ inicializado
        id: detect
        run: |
          TEMPLATES=$(find templates -mindepth 2 -maxdepth 2 -type d -name source | sort)
          if [ -z "$TEMPLATES" ]; then
            echo "ERROR: no hay templates con source/ inicializado."
            echo "El operador debe correr 'git submodule update --init --recursive' antes."
            exit 1
          fi
          echo "templates<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TEMPLATES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Determine target templates
        id: target
        run: |
          if [ -n "${{ inputs.template }}" ]; then
            # Manual run con template específico
            TARGET="templates/${{ inputs.template }}/source"
            if [ ! -d "$TARGET" ]; then
              echo "ERROR: $TARGET no existe."
              exit 1
            fi
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          else
            # Cron run — todos los templates
            echo "target=ALL" >> "$GITHUB_OUTPUT"
          fi

      - name: Run repack
        id: repack
        run: |
          if [ "${{ steps.target.outputs.target }}" = "ALL" ]; then
            ./scripts/repack.sh
          else
            ./scripts/repack.sh "${{ steps.target.outputs.target }}"
          fi

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet templates/*/repomix.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in repomix.txt files."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --stat templates/*/repomix.txt
          fi

      - name: Run skill validator
        run: ./scripts/validate-skills.sh

      - name: Create PR with regenerated repomix.txt
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore(repomix): regenerate compressed contexts

            - Weekly cron repack of templates/*/repomix.txt
            - Triggered by: ${{ github.event_name }} (${{ github.event.schedule }})
            - Source: ${{ github.workflow }}
          branch: chore/repack-${{ github.run_id }}
          title: "chore(repomix): regenerate compressed contexts"
          body: |
            ## What

            Regenerated `repomix.txt` for one or more templates using `scripts/repack.sh`.

            - **Trigger**: ${{ github.event_name }}
            - **When**: ${{ github.event.schedule || github.event.head_commit.timestamp }}

            ## Why

            `repomix.txt` provides compressed AI-friendly context for each template's
            upstream source code. It needs to be kept fresh as upstream changes,
            otherwise AI agents reading the skill get stale code.

            ## Diff

            ```
            $(git diff --stat templates/*/repomix.txt)
            ```

            ## How to verify

            ```bash
            # Spot-check a few templates' repomix.txt
            head -50 templates/admin-tailadmin/repomix.txt
            head -50 templates/ecommerce-storefront/repomix.txt

            # If you see expected upstream changes, approve + merge.
            ```

            Auto-generated by `.github/workflows/repack.yml`.
          labels: |
            chore
            repomix
            automerge
          reviewers: |
            dark-agent
          delete-branch: true
          add-paths: |
            templates/*/repomix.txt