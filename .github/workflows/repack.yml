name: Repack Repomix

on:
  # Weekly cron — Lunes 03:00 UTC
  schedule:
    - cron: "0 3 * * 1"

  # Manual trigger desde la Actions tab
  workflow_dispatch:
    inputs:
      template:
        description: "Repack solo una plantilla visual (vacío = todas)"
        required: false
        type: string

  # Cuando alguien hace push a main que toca INTEGRATION.md o SKILL.md
  push:
    branches: [main]
    paths:
      - "frontend-visual/**/SKILL.md"
      - "frontend-visual/**/THEME.md"
      - "frontend-visual/**/INSTALL.md"
      - ".gitmodules"

concurrency:
  group: repack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo (con submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect visual templates con source/ inicializado
        id: detect
        run: |
          TEMPLATES=$(find frontend-visual -mindepth 2 -maxdepth 2 -type d -name source | sort)
          if [ -z "$TEMPLATES" ]; then
            echo "::warning::No hay visual templates con source/ inicializado."
            echo "El operador debe correr 'git submodule update --init --recursive' antes."
          fi
          echo "templates<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TEMPLATES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Determine target template
        id: target
        run: |
          if [ -n "${{ inputs.template }}" ]; then
            TARGET="frontend-visual/${{ inputs.template }}/source"
            if [ ! -d "$TARGET" ]; then
              echo "::error::$TARGET no existe."
              exit 1
            fi
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
            echo "name=${{ inputs.template }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=ALL" >> "$GITHUB_OUTPUT"
            echo "name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run repack
        id: repack
        run: |
          if [ "${{ steps.target.outputs.target }}" = "ALL" ]; then
            bash scripts/repack.sh
          else
            bash scripts/repack.sh "${{ steps.target.outputs.name }}"
          fi

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet frontend-visual/*/repomix.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in repomix.txt files."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --stat frontend-visual/*/repomix.txt
          fi

      - name: Validate SKILL.md standard compliance
        run: bash scripts/validate-skills.sh

      - name: Create PR with regenerated repomix.txt
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore(repomix): regenerate compressed contexts

            - Triggered by: ${{ github.event_name }}
            - Source: scripts/repack.sh
          branch: chore/repack-${{ github.run_id }}
          title: "chore(repomix): regenerate compressed contexts"
          body: |
            ## What

            Regenerated `repomix.txt` for one or more visual templates using `scripts/repack.sh`.

            - **Trigger**: ${{ github.event_name }}
            - **When**: ${{ github.event.schedule || github.event.head_commit.timestamp }}

            ## Why

            `repomix.txt` provides compressed AI-friendly context for each template's
            upstream source code. It needs to be kept fresh as upstream changes,
            otherwise AI agents reading the skill get stale code.

            ## Diff

            ```
            $(git diff --stat frontend-visual/*/repomix.txt)
            ```

            ## How to verify

            ```bash
            # Spot-check a few templates' repomix.txt
            head -50 frontend-visual/admin-tailadmin/repomix.txt
            head -50 frontend-visual/ecommerce-storefront/repomix.txt

            # If you see expected upstream changes, approve + merge.
            ```

            Auto-generated by `.github/workflows/repack.yml`.
          labels: |
            chore
            repomix
            automerge
          delete-branch: true
          add-paths: |
            frontend-visual/*/repomix.txt